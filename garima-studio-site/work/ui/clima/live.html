<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clima, live</title>
<style>
/* Clima, rebuilt in code from Garima's screens: one palette per condition, a big thin number,
   the condition word set vertically, rounded translucent cards. Tap a condition to change the weather. */
@font-face { font-family: 'CI'; src: url('fonts/inter-latin-200-normal.woff2') format('woff2'); font-weight: 200; }
@font-face { font-family: 'CI'; src: url('fonts/inter-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'CI'; src: url('fonts/inter-latin-500-normal.woff2') format('woff2'); font-weight: 500 600; }
:root { --bg: #E9C46A; --ink: #161616; --card: rgba(255,255,255,.22); }
* { box-sizing: border-box; margin: 0; }
html, body { background: transparent; font-family: 'CI', system-ui, sans-serif; color: #111; -webkit-font-smoothing: antialiased; }
.wrap { display: grid; grid-template-columns: auto minmax(0, 300px); gap: 40px; align-items: center; justify-content: center; padding: 10px 12px 14px; }
.phone { width: 330px; aspect-ratio: 393 / 852; border-radius: 46px; padding: 9px; background: #111; box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); }
.scr { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--bg); color: var(--ink); transition: background .7s ease, color .7s ease; container-type: inline-size; }
.isl { position: absolute; left: 50%; top: 9px; width: 30%; height: 26px; margin-left: -15%; border-radius: 20px; background: #111; z-index: 3; }
.sb { display: flex; justify-content: space-between; padding: 13px 26px 0; font: 600 4.2cqw 'CI'; }
.tabs { display: flex; gap: 0; padding: 12px 6px 0; font: 500 3.9cqw 'CI'; }
.tabs span { flex: 1; text-align: center; padding-bottom: 6px; opacity: .85; }
.tabs .on { border-bottom: 2px solid currentColor; opacity: 1; }
.top { display: flex; justify-content: space-between; align-items: flex-start; padding: 6cqw 6cqw 0; }
.temp { font: 200 30cqw/0.8 'CI'; letter-spacing: -.04em; position: relative; }
.temp sup { font-size: 7cqw; font-weight: 400; position: absolute; top: .3em; margin-left: .2em; letter-spacing: 0; }
.place { text-align: right; font: 400 3.4cqw/1.35 'CI'; padding-top: 5cqw; }
.place b { display: block; font: 500 4.6cqw 'CI'; }
.art { position: relative; height: 62cqw; margin-top: 4cqw; }
.art svg { position: absolute; left: 10cqw; top: 0; width: 62cqw; height: 62cqw; opacity: 0; transform: scale(.9); transition: opacity .6s ease, transform .7s cubic-bezier(.3,1.4,.5,1); }
.art svg.on { opacity: 1; transform: none; }
.word { position: absolute; right: 4cqw; bottom: 2cqw; writing-mode: vertical-rl; transform: rotate(180deg); font: 400 7.6cqw 'CI'; letter-spacing: .04em; }
.card { margin: 4cqw 3cqw 0; border-radius: 6cqw; background: var(--card); padding: 3.4cqw 3cqw; }
.hours { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font: 400 2.9cqw 'CI'; gap: 1cqw; }
.hours svg { width: 8.6cqw; height: 8.6cqw; margin: 2.4cqw auto 0; display: block; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4cqw; margin: 2.4cqw 3cqw 0; }
.tiles div { border-radius: 5cqw; background: var(--card); padding: 3cqw; font: 400 2.8cqw 'CI'; }
.tiles b { display: block; font: 400 5.4cqw 'CI'; margin-top: 1.6cqw; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqw; margin: 2.4cqw 3cqw 0; }
.duo div { border-radius: 5cqw; background: var(--card); padding: 3cqw; font: 400 2.8cqw 'CI'; display: grid; gap: 1.4cqw; }
.duo svg { width: 100%; height: 11cqw; } .duo b { font: 400 5.4cqw 'CI'; } .duo small { font-size: 2.3cqw; opacity: .8; }
.nav { position: absolute; left: 4cqw; right: 4cqw; bottom: 4cqw; display: flex; justify-content: space-between; align-items: center; }
.nav i { display: block; width: 9cqw; height: 9cqw; border-radius: 50%; background: var(--card); position: relative; }
.nav i.g::after { content: ''; position: absolute; inset: 2.2cqw; border: 1.3px solid currentColor; border-radius: 50%; }
.nav i.mn::after { content: ''; position: absolute; left: 2.6cqw; right: 2.6cqw; top: 3cqw; height: 3cqw; border-top: 1.3px solid currentColor; border-bottom: 1.3px solid currentColor; }
.nav .dots { width: 22cqw; height: 6.6cqw; border-radius: 99px; display: flex; justify-content: center; align-items: center; gap: 1.6cqw; }
.nav .dots b { width: 2cqw; height: 2cqw; border-radius: 50%; border: 1.2px solid currentColor; }
.nav .dots b:first-child { background: currentColor; }
/* controls */
.side h3 { font: 500 22px/1.2 'CI'; letter-spacing: -.02em; margin-bottom: 6px; color: #111; }
.side p { color: #555; font-size: 14px; line-height: 1.45; margin-bottom: 16px; }
.conds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.conds button { display: flex; align-items: center; gap: 10px; border: 1.5px solid #e2e2df; background: #fff; border-radius: 12px; padding: 10px 12px; font: 500 14px 'CI'; color: #111; cursor: pointer; text-align: left; transition: border-color .2s, transform .2s; }
.conds button i { width: 22px; height: 22px; border-radius: 7px; flex: none; }
.conds button[aria-pressed="true"] { border-color: #111; transform: translateY(-1px); }
.conds button:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
.note { margin-top: 14px; font-size: 12px; color: #777; }
@media (max-width: 700px) { .wrap { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 22px; } .phone { width: min(300px, 82vw); } .side { width: 100%; max-width: 360px; } }
@media (prefers-reduced-motion: reduce) { .scr, .art svg { transition: none; } }
</style></head>
<body>
<div class="wrap">
  <div class="phone"><div class="scr" id="scr">
    <span class="isl"></span>
    <div class="sb"><span>9:41</span><span>●●● ▮</span></div>
    <div class="tabs"><span class="on">Today</span><span>Tomorrow</span><span>7 Days</span></div>
    <div class="top"><div class="temp"><span id="t">18</span><sup>°c</sup></div><div class="place"><b>London</b>Monday<br>12 Jan 2026</div></div>
    <div class="art" id="art">
      <svg data-k="sunny" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#F4A261"/></svg>
      <svg data-k="windy" viewBox="0 0 200 200" fill="none" stroke="#161616" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><path d="M168 8L58 118C44 130 26 126 24 112C22 98 38 92 48 100"/><path d="M190 30L80 140C66 152 48 148 46 134C44 120 60 114 70 122"/><path d="M196 74L110 168C96 180 78 176 76 162C74 148 90 142 100 150"/></svg>
      <svg data-k="thunder" viewBox="0 0 200 200"><path d="M128 4L40 118h52l-24 78 96-128h-56z" fill="#E9C46A"/></svg>
      <svg data-k="snowy" viewBox="0 0 200 200" fill="#D9D9D9"><circle cx="70" cy="50" r="16"/><circle cx="125" cy="45" r="16"/><circle cx="40" cy="105" r="16"/><circle cx="98" cy="100" r="16"/><circle cx="155" cy="98" r="16"/><circle cx="70" cy="152" r="16"/><circle cx="128" cy="150" r="16"/></svg>
      <svg data-k="cloudy" viewBox="0 0 200 200"><path d="M52 150a36 36 0 0 1-4-72 50 50 0 0 1 96-10 40 40 0 0 1 8 82z" fill="#D9D9D9"/></svg>
      <svg data-k="rainy" viewBox="0 0 200 200" fill="#E5F4F1"><path d="M60 30c18 30 30 48 30 64a30 30 0 0 1-60 0c0-16 12-34 30-64z"/><path d="M140 70c16 26 26 42 26 56a26 26 0 0 1-52 0c0-14 10-30 26-56z"/><path d="M80 120c12 20 20 32 20 43a20 20 0 0 1-40 0c0-11 8-23 20-43z"/></svg>
      <span class="word" id="w">SUNNY</span>
    </div>
    <div class="card"><div class="hours" id="hours"></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="duo"><div><span>Sunset</span><svg viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 30h92"/><path d="M14 30c14-26 58-26 72 0"/><circle cx="66" cy="15" r="3" fill="currentColor"/></svg><small>Sunset: 17:40</small></div><div><span>Precipitation</span><b id="pr">10 mm</b><small>Today</small></div></div>
    <div class="nav"><i class="g"></i><i class="dots"><b></b><b></b><b></b><b></b></i><i class="mn"></i></div>
  </div></div>
  <div class="side">
    <h3>Change the weather</h3>
    <p>Tap a condition. The whole screen changes colour, so you know the mood before you read a number.</p>
    <div class="conds" id="conds"></div>
    <p class="note">Rebuilt in code from the Figma screens.</p>
  </div>
</div>
<script>
const C = {
  sunny:   { n: 'Sunny',   bg: '#E9C46A', ink: '#161616', t: 18, h: ['12:00','13:00','14:00','15:00','16:00'], i: ['sun','sun','sun','cloud','cloud'], d: [['Humidity','35%'],['Feels like','12°'],['Visibility','17 mi']] },
  windy:   { n: 'Windy',   bg: '#E76F51', ink: '#161616', t: 12, h: ['09:00','10:00','11:00','12:00','13:00'], i: ['wind','wind','wind','cloud','wind'], d: [['Humidity','48%'],['Feels like','7°'],['Wind','32 mph']] },
  thunder: { n: 'Thunder', bg: '#5A7985', ink: '#121212', t: 12, h: ['01:00','02:00','03:00','04:00','05:00'], i: ['bolt','bolt','rain','rain','rain'], d: [['Humidity','67%'],['Feels like','9°'],['Visibility','13 mi']] },
  snowy:   { n: 'Snowy',   bg: '#48595F', ink: '#F4F4F2', t: -3, h: ['06:00','07:00','08:00','09:00','10:00'], i: ['snow','snow','snow','cloud','snow'], d: [['Humidity','84%'],['Feels like','-6°'],['Visibility','4 mi']] },
  cloudy:  { n: 'Cloudy',  bg: '#264653', ink: '#F4F4F2', t: 12, h: ['12:00','13:00','14:00','15:00','16:00'], i: ['cloud','cloud','cloud','cloud','sun'], d: [['Humidity','74%'],['Feels like','10°'],['Visibility','12 mi']] },
  rainy:   { n: 'Rainy',   bg: '#2A9D8F', ink: '#161616', t: 15, h: ['17:00','18:00','19:00','20:00','21:00'], i: ['rain','rain','rain','cloud','rain'], d: [['Humidity','94%'],['Feels like','11°'],['Rain','10 mm']] },
};
const ICON = {
  sun: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.4 1.5A3.3 3.3 0 0 1 17.5 18z"/>',
  wind: '<path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h6"/>',
  bolt: '<path d="M13 2L5 13h6l-2 9 8-12h-6z"/>',
  rain: '<path d="M7 14a4 4 0 0 1-.5-8 6 6 0 0 1 11.4 1.5A3.3 3.3 0 0 1 17.5 14zM8 17l-1 3M12 17l-1 3M16 17l-1 3"/>',
  snow: '<path d="M7 14a4 4 0 0 1-.5-8 6 6 0 0 1 11.4 1.5A3.3 3.3 0 0 1 17.5 14z"/><circle cx="8" cy="19" r=".9"/><circle cx="12" cy="20" r=".9"/><circle cx="16" cy="19" r=".9"/>',
};
const scr = document.getElementById('scr'), conds = document.getElementById('conds');
conds.innerHTML = Object.entries(C).map(([k, c]) => `<button type="button" data-k="${k}" aria-pressed="false"><i style="background:${c.bg}"></i>${c.n}</button>`).join('');
let cur = 'sunny', touched = false;
function set(k) {
  cur = k; const c = C[k];
  scr.style.setProperty('--bg', c.bg); scr.style.setProperty('--ink', c.ink);
  scr.style.setProperty('--card', c.ink === '#161616' || c.ink === '#121212' ? 'rgba(255,255,255,.24)' : 'rgba(255,255,255,.12)');
  document.getElementById('t').textContent = c.t;
  document.getElementById('w').textContent = c.n.toUpperCase();
  document.querySelectorAll('#art svg').forEach((s) => s.classList.toggle('on', s.dataset.k === k));
  document.getElementById('hours').innerHTML = c.h.map((h, n) => `<div>${h}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICON[c.i[n]]}</svg></div>`).join('');
  document.getElementById('pr').textContent = { sunny: '0 mm', windy: '2 mm', thunder: '18 mm', snowy: '6 cm', cloudy: '1 mm', rainy: '10 mm' }[k];
  document.getElementById('tiles').innerHTML = c.d.map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
  conds.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
}
conds.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; touched = true; set(b.dataset.k); });
set(new URLSearchParams(location.search).get('c') || 'sunny');
// gently shows itself off until someone taps
const order = Object.keys(C);
if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !location.search.includes('still')) {
  setInterval(() => { if (!touched) set(order[(order.indexOf(cur) + 1) % order.length]); }, 2600);
}
</script>
</body></html>
