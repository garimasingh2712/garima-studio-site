<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resurrected, the trick</title>
<style>
/* The phenakistiscope trick, shown with the real disc art.
   "In step" turns the disc exactly one frame at a time, so the drawing moves.
   "Free spin" turns it smoothly at the same speed, so it smears into a ring. */
@font-face { font-family: 'IS'; src: url('../fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IS'; src: url('../fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); font-style: italic; }
@font-face { font-family: 'DMM'; src: url('../fonts/dm-mono-latin-400-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { background: #1E1A16; color: #F1E8DA; font-family: 'DMM', ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
.wrap { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: clamp(24px, 5vw, 70px); align-items: center; padding: 6px 8px 14px; }
.deck { position: relative; aspect-ratio: 1; border-radius: 18px; background: #24201B; box-shadow: inset 0 0 0 1px rgba(241,232,218,.08); display: grid; place-items: center; overflow: hidden; }
.platter { position: absolute; width: 88%; aspect-ratio: 1; border-radius: 50%; background: repeating-radial-gradient(circle, #0E0C0A 0 2px, #171411 2px 4px); box-shadow: 0 20px 40px -18px rgba(0,0,0,.8); }
.disc { position: relative; width: 84%; aspect-ratio: 1; will-change: transform; }
.disc img { width: 100%; height: 100%; display: block; border-radius: 50%; }
.disc.blur img { filter: blur(var(--b, 0px)); }
.spindle { position: absolute; width: 3.2%; aspect-ratio: 1; border-radius: 50%; background: #CFC6B8; box-shadow: 0 0 0 3px #0E0C0A; }
.arm { position: absolute; right: 4%; top: 6%; width: 40%; height: 54%; pointer-events: none; }
.side h3 { font: italic 400 clamp(28px, 3vw, 40px)/1.05 'IS', Georgia, serif; }
.side p { color: #BFB4A4; font-size: 13px; line-height: 1.6; margin: 10px 0 18px; max-width: 46ch; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.row button { border: 1px solid rgba(241,232,218,.25); background: transparent; color: #F1E8DA; border-radius: 99px; padding: 8px 14px; font: 400 12px 'DMM'; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.row button[aria-pressed="true"] { background: #F1E8DA; color: #15120F; border-color: #F1E8DA; }
.row button:focus-visible { outline: 2px solid #E9B98A; outline-offset: 2px; }
.read { display: grid; grid-template-columns: repeat(3, auto); gap: 18px; justify-content: start; margin-top: 18px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9C907F; }
.read b { display: block; font: italic 400 30px 'IS', serif; letter-spacing: 0; text-transform: none; color: #F1E8DA; margin-top: 2px; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } .deck { max-width: 420px; width: 100%; margin: 0 auto; } }
</style></head>
<body>
<div class="wrap">
  <div class="deck"><div class="platter"></div><div class="disc" id="disc"><img id="img" src="../../resurrected/discpastel.webp" alt="Pastel Blues picture disc"></div><span class="spindle"></span>
    <svg class="arm" viewBox="0 0 100 130" aria-hidden="true"><circle cx="80" cy="16" r="11" fill="#3A332B"/><path d="M80 16L70 100l-16 14" stroke="#CFC6B8" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="44" y="108" width="16" height="10" rx="2" fill="#CFC6B8" transform="rotate(-40 52 113)"/></svg>
  </div>
  <div class="side">
    <h3>See the trick</h3>
    <p>A phenakistiscope only works when the disc moves exactly one drawing at a time. In step, the sun sets and rises. Spin it freely at the same speed and it smears into a ring.</p>
    <div class="row" id="recs"></div>
    <div class="row" id="modes"><button type="button" data-m="step" aria-pressed="true">In step</button><button type="button" data-m="free" aria-pressed="false">Free spin</button><button type="button" data-m="slow" aria-pressed="false">Frame by frame</button></div>
    <div class="read"><div>Frames<b id="rN">12</b></div><div>Each step<b id="rD">30°</b></div><div>Speed<b id="rF">12 fps</b></div></div>
  </div>
</div>
<script>
const R = { pastel: { n: 'Pastel Blues', N: 12, fps: 12 }, discovery: { n: 'Discovery', N: 16, fps: 16 }, blonde: { n: 'Blonde', N: 12, fps: 10 } };
const disc = document.getElementById('disc'), img = document.getElementById('img');
document.getElementById('recs').innerHTML = Object.entries(R).map(([k, r]) => `<button type="button" data-r="${k}" aria-pressed="${k === 'pastel'}">${r.n}</button>`).join('');
let rec = 'pastel', mode = 'step', f = 0, last = performance.now(), angle = 0;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function readout() { const r = R[rec]; document.getElementById('rN').textContent = r.N; document.getElementById('rD').textContent = (360 / r.N).toFixed(r.N === 16 ? 1 : 0) + '°'; document.getElementById('rF').textContent = (mode === 'slow' ? 2 : r.fps) + ' fps'; }
function tick(now) {
  const r = R[rec], fps = mode === 'slow' ? 2 : r.fps, dt = now - last;
  if (mode === 'free') { angle += (360 / r.N) * fps * dt / 1000; disc.style.transform = `rotate(${angle}deg)`; disc.classList.add('blur'); disc.style.setProperty('--b', '1.6px'); last = now; }
  else if (dt >= 1000 / fps) { f += 1; angle = f * 360 / r.N; disc.style.transform = `rotate(${angle}deg)`; disc.classList.remove('blur'); last = now; }
  requestAnimationFrame(tick);
}
document.getElementById('recs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; rec = b.dataset.r; img.src = `../../resurrected/disc${rec}.webp`; img.alt = R[rec].n + ' picture disc'; f = 0; document.querySelectorAll('#recs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); readout(); });
document.getElementById('modes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; f = Math.round(angle / (360 / R[rec].N)); document.querySelectorAll('#modes button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); readout(); });
readout();
if (still) { mode = 'slow'; document.querySelectorAll('#modes button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.m === 'slow'))); readout(); }
requestAnimationFrame(tick);
</script>
</body></html>
