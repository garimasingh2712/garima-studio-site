<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Remedies — remedies for London troubles</title>
<!--
  SMALL REMEDIES: interactive packaging piece by Garima Singh.
  One file: HTML + CSS + vanilla JS, no images, no libraries. Click a box to open it:
  the lid lifts, the prescription rises and unfolds, the blister slides out. Click again to put it all back.
  Each remedy is drawn at 448 x 660 and scales to its column. Three across on desktop, stacked on phones.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Playfair+Display+SC:wght@400;700&family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EFEFEB; }
  .sr-wrap { max-width: 1456px; margin: 0 auto; padding: 40px 24px; }

  .sr { --sr-text: #0F0F0E; --sr-text-2: #5C5C58; --sr-border: #C8C5BC; color: var(--sr-text); font-family: 'Inter', 'Helvetica Neue', sans-serif; }
  .sr * { box-sizing: border-box; }
  .sr-intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 40px; border-bottom: .5px solid var(--sr-border); padding-bottom: 24px; margin-bottom: 36px; }
  .sr-intro p { margin: 0; max-width: 540px; font-size: 16px; line-height: 1.55; color: var(--sr-text-2); text-wrap: pretty; }
  .sr-intro .sr-wit { font-family: Georgia, serif; font-style: italic; font-size: 15px; max-width: 420px; }
  .sr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(24px, 4vw, 56px); }
  .sr-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .sr-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: .5px solid var(--sr-border); padding-bottom: 14px; }
  .sr-head-t { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 24px; line-height: 1.1; }
  .sr-head-s { margin-top: 4px; font-size: 14px; color: var(--sr-text-2); }
  .sr-head-n { font-size: 13px; color: var(--sr-text-2); white-space: nowrap; }
  .sr-fit { position: relative; width: 100%; aspect-ratio: 448 / 600; }
  .sr-stage { position: absolute; left: 0; top: 0; width: 448px; height: 660px; perspective: 1400px; transform-origin: 0 0; }
  .sr-stage button { font: inherit; }
  .sr-hint { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--sr-text-2); }
  @media (max-width: 760px) {
    .sr-grid { grid-template-columns: minmax(0, 1fr); gap: 48px; }
    .sr-col { max-width: 448px; width: 100%; margin: 0 auto; }
  }
  .sr.still *, .sr.still *::before { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .sr * { transition-duration: 1ms !important; transition-delay: 0ms !important; } }
  .sr button:focus-visible { outline: 2px solid #0F0F0E; outline-offset: 3px; }

</style>
</head>
<body>
<div class="sr-wrap">
<div class="sr" id="sr">
  <div class="sr-intro">
    <p>Remedies for modern London troubles, packaged like the chemist's shelf of 1900, printed fresh today. Click a box to open it.</p>
    <p class="sr-wit">Not real medicine. Please do not take two and call anyone in the morning.</p>
  </div>
  <div class="sr-grid" id="sr-grid"></div>
</div>
</div>
<script>
(() => {
  const DATA = [
    { id: 'train', no: 'No. 1', serial: '0031', date: '1 Oct', complaint: 'missed the last train', title: 'Missed the Last Train', stamp: '00:31', note: 'with dignity!',
      active: 'Patience', form: 'pills', strength: '500 mg', count: 'Twenty-four Pills', price: '£2.49',
      colour: '#2C4566', accent: '#C9D4DE', bandInk: '#2C4566', pill: '#FFFFFF', score: 'rgba(44,69,102,0.35)', popped: [0],
      l2: 'Take ONE pill as the doors close. Do not give chase. Do not curse aloud. Await the night omnibus.',
      l3: 'May occasion a sudden fondness for night buses, a forty-minute walk, and a detour via the chicken shop.',
      l4: 'In a cool coat pocket, far from the surge-priced cab.',
      icon: '<path d="M30 6a17 17 0 1 0 10 28A15 15 0 0 1 30 6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 20 h1 M18 30 h1 M24 14 h1" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="0.8"><line x1="10" y1="24" x2="22" y2="12"/><line x1="12" y1="30" x2="26" y2="16"/><line x1="16" y1="34" x2="30" y2="20"/></g>' },
    { id: 'rain', no: 'No. 2', serial: '0172', date: '9 Oct', complaint: 'rain on the commute', title: 'Rain on the Commute', stamp: 'WET', note: 'hood up!',
      active: 'Resilience', form: 'tablets', strength: '250 mg', count: 'Twenty Tablets', price: '£3.99',
      colour: '#24584A', accent: '#CFE0D3', bandInk: '#24584A', pill: '#DCEFE6', score: 'rgba(36,88,74,0.35)', popped: [3],
      l2: 'Take ONE at the bus stop. Apply hood liberally. Never, ever open an umbrella on the escalator.',
      l3: 'Prolonged talk of the weather. A steamed-up top deck. The odour of damp wool until Thursday.',
      l4: 'Anywhere at all. It will be raining there too.',
      icon: '<path d="M5 22a18 18 0 0 1 36 0z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M23 4v2 M23 22v14a4 4 0 0 1-8 0" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 22 Q23 8 32 22 M23 22 V6" fill="none" stroke="currentColor" stroke-width="0.8"/><path d="M8 30 l-2 5 M36 30 l-2 5 M30 38 l-2 5 M12 38 l-2 5" stroke="currentColor" stroke-width="1.2"/>' },
    { id: 'rent', no: 'No. 3', serial: '0028', date: '25 Oct', complaint: 'rent day, again', title: 'Rent Day', stamp: '1st', note: 'hang on in there',
      active: 'Fortitude', form: 'capsules', strength: '28-day', count: 'A Month’s Course', price: '£6.50',
      colour: '#B1302A', accent: '#EDB540', bandInk: '#7A1F1A', pill: '#F6C9C3', score: 'rgba(177,48,42,0.35)', popped: [0, 1, 2, 5, 6],
      l2: 'ONE each morning until the first. Double the dose should the landlord write "quick one".',
      l3: 'Meal deals. Evenings "staying in". Consulting one’s balance with one eye shut.',
      l4: 'Out of reach of estate agents. Not to be stored in a "cosy" studio.',
      icon: '<path d="M6 22 L23 7 L40 22 M10 19 V40 H36 V19" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19 40 V29 H27 V40" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 24 h6 v5 h-6 z M27 24 h6 v5 h-6 z" fill="none" stroke="currentColor" stroke-width="1"/><g stroke="currentColor" stroke-width="0.7"><line x1="11" y1="33" x2="18" y2="33"/><line x1="11" y1="36" x2="18" y2="36"/><line x1="28" y1="33" x2="35" y2="33"/><line x1="28" y1="36" x2="35" y2="36"/></g>' }
  ];
  const PANEL = 'position:absolute;left:0;top:120px;width:236px;height:120px;background:#FBF6EA;padding:10px 12px;transform-origin:50% 0;transform:rotateX(-90deg);transition:transform 500ms ease;transform-style:preserve-3d;box-shadow:0 1px 2px rgba(15,15,14,.15),inset 0 6px 6px -6px rgba(60,40,20,.25)';
  const SC = "font-family:'Playfair Display SC',serif;font-weight:700;font-size:9px;letter-spacing:.12em";
  const HAND = "font-family:'Homemade Apple',cursive;color:#23365F;white-space:nowrap";
  const TYPE = "font-family:'Special Elite',monospace";

  function item(d) {
    const c = d.colour, A = d.active.toUpperCase(), F = d.form.toUpperCase();
    const pills = Array.from({ length: 10 }, (_, k) => d.popped.includes(k)
      ? '<div style="width:24px;height:24px;border-radius:50%;background:#D9DCE0;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);border:1px dashed #9EA3A9"></div>'
      : `<div style="position:relative;width:24px;height:24px;border-radius:50%;background:${d.pill};box-shadow:inset -2px -3px 4px rgba(0,0,0,.14),inset 2px 2px 3px rgba(255,255,255,.8),0 2px 3px rgba(0,0,0,.2)"><div style="position:absolute;left:20%;right:20%;top:50%;height:1px;background:${d.score}"></div></div>`).join('');
    return `
    <div class="sr-col">
      <div class="sr-head"><div><div class="sr-head-t">${d.title}</div><div class="sr-head-s">${d.active} ${d.form}</div></div><div class="sr-head-n">${d.no}</div></div>
      <div class="sr-fit"><div class="sr-stage">
        <div data-r="blister" style="position:absolute;left:24px;top:300px;width:186px;height:104px;border-radius:8px;background:linear-gradient(135deg,#EEF0F2 0%,#C3C7CC 42%,#F5F6F8 58%,#C9CDD2 100%);box-shadow:0 2px 5px rgba(15,15,14,.22);padding:13px 14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;align-items:center;justify-items:center;transition:transform 800ms cubic-bezier(.2,.9,.25,1);z-index:1">${pills}</div>

        <div data-r="leaf" style="position:absolute;left:14px;top:190px;width:236px;transform-origin:50% 0;transform:translate(0px,0px) scale(.76);z-index:0;transition:transform 900ms cubic-bezier(.2,.9,.25,1);transform-style:preserve-3d">
          <button type="button" data-r="leafBtn" aria-label="Fold the prescription back into the ${d.title} box" style="display:block;width:236px;padding:0;border:0;background:none;text-align:left;cursor:pointer;transform-style:preserve-3d;color:#1F1A14">
            <div style="position:relative;width:236px;height:120px;background:#FBF6EA;box-shadow:0 1px 2px rgba(15,15,14,.15);padding:10px 12px;transform-style:preserve-3d;font-family:'IM Fell English',Georgia,serif">
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div style="font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:30px;line-height:.8;color:${c}">Rx</div>
                <div style="display:flex;align-items:center;gap:7px">
                  <div style="text-align:right">
                    <div style="${SC};font-size:8px;letter-spacing:.1em;white-space:nowrap;color:${c}">SMALL REMEDIES &amp; Co.</div>
                    <div style="font-size:7.5px;font-style:italic">Dispensing Chemists · Brockley, S.E.</div>
                    <div style="margin-top:2px;${TYPE};font-size:8px;color:#B3261E">No. ${d.serial}</div>
                  </div>
                  <div aria-hidden="true" style="width:38px;height:38px;flex:none;border-radius:50%;border:1.5px solid ${c};box-shadow:inset 0 0 0 2px #FBF6EA,inset 0 0 0 3px ${c};display:flex;align-items:center;justify-content:center;color:${c};font-family:'Playfair Display',serif;font-style:italic;font-weight:900;font-size:17px;line-height:1;letter-spacing:-.12em"><span style="transform:translateY(-1px)">G</span><span style="transform:translate(-1px,3px);font-size:15px">S</span></div>
                </div>
              </div>
              <div style="margin-top:10px;display:flex;align-items:baseline;gap:6px;font-size:8.5px"><span>Name</span><div style="flex:1;border-bottom:1px dotted #6B5A44;position:relative;height:12px"><span style="position:absolute;left:6px;bottom:-1px;${HAND};font-size:10px">A. Londoner</span></div><span>Date</span><div style="width:54px;border-bottom:1px dotted #6B5A44;position:relative;height:12px"><span style="position:absolute;left:4px;bottom:-1px;${HAND};font-size:9px">${d.date}</span></div></div>
              <div style="margin-top:7px;display:flex;align-items:baseline;gap:6px;font-size:8.5px"><span>Complaint</span><div style="flex:1;border-bottom:1px dotted #6B5A44;position:relative;height:12px"><span style="position:absolute;left:6px;bottom:-1px;${HAND};font-size:9px">${d.complaint}</span></div></div>

              <div data-r="f2" style="${PANEL}">
                <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid ${c};padding-bottom:3px"><div style="${SC};color:${c}">PRESCRIBED</div><div style="${TYPE};font-size:8.5px">${d.active} ${d.strength}</div></div>
                <div style="margin-top:5px;${TYPE};font-size:8.5px;line-height:1.35">${d.l2}</div>
                <div style="position:absolute;right:12px;bottom:6px;${HAND};font-size:9px;transform:rotate(-3deg)">${d.note}</div>

                <div data-r="f3" style="${PANEL}">
                  <div style="border:1.5px solid #B3261E;padding:6px 8px;height:100%">
                    <div style="${SC};font-size:8px;letter-spacing:.08em;white-space:nowrap;color:#B3261E">CAUTION · POSSIBLE SIDE EFFECTS</div>
                    <div style="margin-top:4px;font-size:9.5px;line-height:1.3">${d.l3}</div>
                  </div>

                  <div data-r="f4" style="${PANEL};box-shadow:0 2px 4px rgba(15,15,14,.18),inset 0 6px 6px -6px rgba(60,40,20,.25)">
                    <div style="${SC};color:${c}">TO BE KEPT</div>
                    <div style="margin-top:3px;font-size:9.5px;line-height:1.3;max-width:140px">${d.l4}</div>
                    <div style="position:absolute;left:12px;bottom:10px;width:120px"><div style="${HAND};font-size:11px;transform:rotate(-4deg)">G. Singh</div><div style="border-top:1px dotted #6B5A44;font-size:7px;font-style:italic;padding-top:1px">Dispensing chemist</div></div>
                    <div style="position:absolute;right:12px;top:30px;width:64px;height:64px;border-radius:50%;border:2px solid rgba(179,38,30,.8);box-shadow:inset 0 0 0 3px #FBF6EA,inset 0 0 0 4px rgba(179,38,30,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);color:rgba(179,38,30,.85);${TYPE};font-size:6.5px;line-height:1.2;text-align:center">DISPENSED<br><span style="font-size:11px">${d.stamp}</span><br>BROCKLEY S.E.</div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </div>

        <button type="button" data-r="box" aria-label="Open the ${d.title} box" style="position:absolute;left:24px;top:120px;width:196px;height:296px;padding:0;border:0;background:none;cursor:pointer;z-index:3;transform-style:preserve-3d;color:#1F1A14;text-align:left">
          <div style="position:absolute;left:6px;right:6px;top:0;height:54px;background:#2A2420"></div>
          <div style="position:absolute;left:0;top:54px;width:196px;height:242px;background:${c};box-shadow:0 1px 1px rgba(15,15,14,.18),0 16px 28px rgba(15,15,14,.2),inset -10px 0 12px -10px rgba(0,0,0,.25);border-radius:2px">
            <div style="position:absolute;left:10px;right:10px;top:10px;bottom:10px;background:#FBF6EA;box-shadow:inset 0 0 0 1.5px ${c},inset 0 0 0 4px #FBF6EA,inset 0 0 0 5px ${c};padding:11px 12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;color:${c}">
              <div style="font-family:'IM Fell English',serif;font-style:italic;font-size:8.5px;color:#1F1A14">From SMALL REMEDIES &amp; Co., Druggists</div>
              <div style="margin-top:3px;width:100%;border-top:.75px solid ${c}"></div>
              <div style="margin-top:5px;font-family:'Playfair Display SC',serif;font-size:8px;letter-spacing:.2em">${d.no}</div>
              <div style="margin-top:3px;font-family:'Playfair Display',serif;font-weight:900;font-size:24px;line-height:.95;letter-spacing:.01em">${A}</div>
              <div style="font-family:'Playfair Display SC',serif;font-weight:700;font-size:10px;letter-spacing:.22em">${F} · ${d.strength}</div>
              <div style="margin-top:7px;width:calc(100% + 24px);padding:5px 0;background:${d.accent};color:${d.bandInk};font-family:'Playfair Display',serif;font-weight:700;font-size:11.5px;line-height:1.1">for ${d.title}</div>
              <div style="margin-top:7px;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 46 46" aria-hidden="true">${d.icon}</svg></div>
              <div style="margin-top:auto;font-family:'IM Fell English',serif;font-size:9.5px;line-height:1.2;color:#1F1A14">${d.count} · Price ${d.price}</div>
              <div style="margin-top:3px;width:100%;border-top:.75px solid ${c}"></div>
              <div style="margin-top:3px;font-family:'IM Fell English',serif;font-size:7.5px;color:#5A4A36">Brockley Rise &amp; Stondon Park, London S.E.</div>
            </div>
          </div>
          <div data-r="lid" style="position:absolute;left:0;top:0;width:196px;height:54px;transform-origin:50% 0;transform:rotateX(0deg);transition:transform 600ms cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d">
            <div style="position:absolute;inset:0;background:${c};border-radius:2px 2px 0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25),inset -10px 0 12px -10px rgba(0,0,0,.25)">
              <div style="padding:4px 14px;background:#FBF6EA;box-shadow:inset 0 0 0 1px ${c},inset 0 0 0 3px #FBF6EA,inset 0 0 0 4px ${c};font-family:'Playfair Display SC',serif;font-weight:700;font-size:10px;letter-spacing:.16em;color:${c}">${d.no} · ${A}</div>
            </div>
            <div style="position:absolute;inset:0;background:#E8DFC9;transform:rotateX(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden"></div>
          </div>
        </button>
      </div></div>
    </div>`;
  }

  const root = document.getElementById('sr');
  const grid = document.getElementById('sr-grid');
  grid.innerHTML = DATA.map(item).join('');
  const cols = [...grid.querySelectorAll('.sr-col')].map((col) => {
    const q = (r) => col.querySelector(`[data-r="${r}"]`);
    return { fit: col.querySelector('.sr-fit'), stage: col.querySelector('.sr-stage'), blister: q('blister'), leaf: q('leaf'), leafBtn: q('leafBtn'), box: q('box'), lid: q('lid'), f: [q('f2'), q('f3'), q('f4')] };
  });

  // 0 closed · 1 lid open · 2 prescription lifted · 3 prescription unfolded beside the box, blister out
  const st = [0, 0, 0], seq = [0, 0, 0];
  function paint(i) {
    const s = st[i], c = cols[i], d = DATA[i], unfold = s === 3;
    c.lid.style.transform = `rotateX(${s >= 1 ? 150 : 0}deg)`;
    c.leaf.style.transform = s === 3 ? 'translate(196px, -150px) scale(1)' : (s === 2 ? 'translate(0px, -140px) scale(.76)' : 'translate(0px, 0px) scale(.76)');
    c.leaf.style.zIndex = s === 3 ? 4 : 0;
    c.f.forEach((p, k) => { p.style.transitionDelay = (unfold ? [450, 850, 1250][k] : 0) + 'ms'; p.style.transform = `rotateX(${unfold ? 0 : -90}deg)`; });
    c.blister.style.transitionDelay = (unfold ? 300 : 0) + 'ms';
    c.blister.style.transform = unfold ? 'translate(6px, 196px) rotate(-6deg)' : 'translate(0px, 0px) rotate(0deg)';
    c.box.setAttribute('aria-label', (s === 0 ? 'Open the ' : 'Close the ') + d.title + ' box');
    c.leafBtn.tabIndex = s === 3 ? 0 : -1;
  }
  const set = (i, v) => { st[i] = v; paint(i); };
  const later = (i, ms, fn) => { const t = seq[i]; setTimeout(() => { if (seq[i] === t) fn(); }, ms); };
  function open(i) {
    [0, 1, 2].forEach((j) => { if (j !== i && st[j] !== 0) close(j); });
    seq[i] += 1; set(i, 1);
    later(i, 500, () => set(i, 2));
    later(i, 1250, () => set(i, 3));
  }
  function close(i) {
    seq[i] += 1; set(i, 2);
    later(i, 700, () => set(i, 1));
    later(i, 1500, () => set(i, 0));
  }
  cols.forEach((c, i) => {
    c.box.addEventListener('click', () => { if (st[i] === 0) open(i); else if (st[i] === 3) close(i); });
    c.leafBtn.addEventListener('click', () => { if (st[i] === 3) close(i); });
    paint(i);
  });

  // each 448 x 660 stage scales to its column
  const fit = () => cols.forEach((c) => { const k = c.fit.clientWidth / 448; c.stage.style.transform = `scale(${k})`; c.stage.style.top = (-30 * k) + 'px'; });
  new ResizeObserver(fit).observe(grid);
  fit();

  window.SmallRemedies = { open, close, set: (i, v) => { seq[i] += 1; set(i, v); }, root };
})();
</script>
</body>
</html>
