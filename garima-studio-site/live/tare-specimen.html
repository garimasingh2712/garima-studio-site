<script>/* Tiny runtime for the Tare boards: renders a template with {{holes}}, <sc-for> and <sc-if>,
   runs the board's own Component class, and patches the page in place on every setState so CSS transitions still play. */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (this.__render) this.__render(); }
  }
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const lit = { true: true, false: false, null: null };
  function look(path, scope) {
    if (path in lit) return lit[path];
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let cur = scope;
    for (const k of path.split('.')) { if (cur == null) return ''; cur = cur[k]; }
    return cur == null ? '' : cur;
  }
  const sub = (s, scope) => s.replace(HOLE, (_, p) => { const v = look(p, scope); return typeof v === 'function' ? '' : String(v); });
  const single = (s) => { const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(s); return m ? m[1] : null; };
  const BOOL = { checked: 1, disabled: 1, selected: 1, hidden: 1, readonly: 1 };
  const kids = (n) => (n.content ? n.content.childNodes : n.childNodes);

  function build(node, scope, out) {
    if (node.nodeType === 3) {
      const txt = sub(node.nodeValue, scope);
      // a hole that carries markup (e.g. a string of <path> elements) is inserted as markup, in the parent's namespace
      if (node.nodeValue.indexOf('{{') >= 0 && /^\s*<[a-zA-Z]/.test(txt)) {
        const svg = node.parentNode && node.parentNode.namespaceURI === 'http://www.w3.org/2000/svg';
        const t = document.createElement('template');
        t.innerHTML = svg ? '<svg>' + txt + '</svg>' : txt;
        [...(svg ? t.content.firstChild.childNodes : t.content.childNodes)].forEach((c) => { c.__dc = {}; out.push(c); });
        return;
      }
      out.push(document.createTextNode(txt)); return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'template' && node.hasAttribute('data-sc-for')) {
      const list = look(single(node.getAttribute('list')) || '', scope) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((it, i) => { const s = Object.assign(Object.create(scope), { [as]: it, $index: i }); kids(node).forEach((c) => build(c, s, out)); });
      return;
    }
    if (tag === 'template' && node.hasAttribute('data-sc-if')) {
      if (look(single(node.getAttribute('value')) || '', scope)) kids(node).forEach((c) => build(c, scope, out));
      return;
    }
    const el = node.cloneNode(false);
    el.__dc = {};
    for (const a of [...node.attributes]) {
      const n = a.name;
      if (n.startsWith('hint-placeholder')) { el.removeAttribute(n); continue; }
      if (n.startsWith('on')) { el.removeAttribute(n); const p = single(a.value); if (p) el.__dc[n.slice(2)] = look(p, scope); continue; }
      if (a.value.indexOf('{{') < 0) continue;
      const p = single(a.value);
      if (p && BOOL[n]) { const v = look(p, scope); if (v && v !== 'false') el.setAttribute(n, ''); else el.removeAttribute(n); continue; }
      el.setAttribute(n, sub(a.value, scope));
    }
    const ch = [];
    kids(node).forEach((c) => build(c, scope, ch));
    ch.forEach((c) => el.appendChild(c));
    out.push(el);
  }

  function syncProps(a, b) {
    a.__dc = b.__dc;
    const t = a.localName;
    if (t === 'input' || t === 'textarea') {
      if (a.type === 'checkbox' || a.type === 'radio') { const c = b.hasAttribute('checked'); if (a.checked !== c) a.checked = c; }
      else if (b.hasAttribute('value')) { const v = b.getAttribute('value'); if (a.value !== v) a.value = v; }
    }
    if (t === 'select' && b.hasAttribute('value')) { const v = b.getAttribute('value'); if (a.value !== v) a.value = v; }
  }
  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || a.namespaceURI !== b.namespaceURI) { a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    morphKids(a, [...b.childNodes]);
    syncProps(a, b);
  }
  function morphKids(parent, next) {
    const cur = [...parent.childNodes];
    next.forEach((n, i) => { if (i < cur.length) morph(cur[i], n); else { parent.appendChild(n); if (n.nodeType === 1) syncAll(n); } });
    for (let i = next.length; i < cur.length; i++) cur[i].remove();
  }
  function syncAll(el) { syncProps(el, el); el.querySelectorAll('*').forEach((e) => syncProps(e, e)); }

  const BUBBLE = ['click', 'input', 'change', 'pointermove', 'pointerdown', 'pointerup', 'keydown', 'pointerover', 'pointerout'];
  const DIRECT = ['pointerleave', 'pointerenter', 'mouseleave', 'mouseenter'];
  function wrap(e, el) { return new Proxy(e, { get: (t, k) => (k === 'currentTarget' ? el : (typeof t[k] === 'function' ? t[k].bind(t) : t[k])) }); }

  window.mountDC = function (root, templateHTML, classSource, props) {
    const tpl = document.createElement('template');
    tpl.innerHTML = templateHTML
      .replace(/<sc-for\b/g, '<template data-sc-for').replace(/<\/sc-for>/g, '</template>')
      .replace(/<sc-if\b/g, '<template data-sc-if').replace(/<\/sc-if>/g, '</template>');
    const Component = new Function('DCLogic', classSource + '\n;return Component;')(DCLogic);
    const c = new Component(props || {});
    c.state = c.state || {};
    let queued = false;
    const render = () => {
      queued = false;
      const vals = c.renderVals();
      const scope = Object.assign({}, c.props, vals);
      const out = [];
      kids(tpl).forEach((n) => build(n, scope, out));
      morphKids(root, out);
    };
    c.__render = () => { if (!queued) { queued = true; queueMicrotask(render); } };
    BUBBLE.forEach((type) => root.addEventListener(type, (e) => {
      for (let el = e.target; el && el !== root.parentNode; el = el.parentNode) {
        const f = el.__dc && el.__dc[type];
        if (typeof f === 'function') { f(wrap(e, el)); if (type === 'click' || type === 'input' || type === 'change') break; }
      }
    }));
    DIRECT.forEach((type) => root.addEventListener(type, (e) => { const f = e.target.__dc && e.target.__dc[type]; if (typeof f === 'function') f(wrap(e, e.target)); }, true));
    render();
    if (c.componentDidMount) c.componentDidMount();
    return c;
  };

  // scale a fixed-width board to its container
  window.fitDC = function (wrap, board, width) {
    const fit = () => { const k = Math.min(1, wrap.clientWidth / width); board.style.transform = `scale(${k})`; wrap.style.height = Math.ceil(board.offsetHeight * k) + 'px'; };
    new ResizeObserver(fit).observe(wrap); new ResizeObserver(fit).observe(board); fit();
  };
})();
</script>
